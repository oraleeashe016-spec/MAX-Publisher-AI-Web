name: Frontend JavaScript checks
on:
  push:
    branches: [main, "fix/**", "feature/**"]
    paths:
      - "backend-client.js"
      - "index.html"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    paths:
      - "backend-client.js"
      - "index.html"
      - ".github/workflows/frontend-tests.yml"
permissions:
  contents: read
jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check backend client syntax
        run: node --check backend-client.js
      - name: Extract and check inline application JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          source = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", source, flags=re.I | re.S)
          inline_scripts = [script for script in scripts if script.strip()]
          if not inline_scripts:
              raise SystemExit("No inline JavaScript found in index.html")
          Path("/tmp/index-inline.js").write_text("".join(inline_scripts), encoding="utf-8")
          print(f"Extracted {len(inline_scripts)} inline script block(s)")
          PY
          node --check /tmp/index-inline.js
