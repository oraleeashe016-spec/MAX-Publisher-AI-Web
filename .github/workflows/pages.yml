name: Deploy MAX Publisher AI Web
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Prepare Python for RSS cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public RSS cache
        run: |
          python -m pip install --disable-pip-version-check 'feedparser>=6,<7'
          python scripts/update_rss_cache.py
      - name: Verify site version
        run: |
          echo "Deploying MAX Publisher AI Web"
          test -s rss-feed.json
          python -c 'import json; d=json.load(open("rss-feed.json", encoding="utf-8")); print("RSS items:", d["count"])'
          grep -n "RSS-новости" index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 10); do
            count=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" | jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" -gt 0 ]; then
              echo "github-pages artifact is visible"
              exit 0
            fi
            echo "Artifact not visible yet (attempt $attempt/10)"
            sleep 3
          done
          echo "github-pages artifact did not become visible"
          exit 1
      - name: Deploy attempt 1
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Deploy attempt 2
        id: deployment_retry_2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Deploy attempt 3
        id: deployment_retry_3
        if: steps.deployment_retry_2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Fail if all deploy attempts failed
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_2.outcome == 'failure' && steps.deployment_retry_3.outcome == 'failure'
        run: |
          echo "GitHub Pages deployment failed after three attempts."
          exit 1
